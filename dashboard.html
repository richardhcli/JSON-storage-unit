<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Incremental System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      display: flex;
      height: 100vh;
    }

    .container {
      display: flex;
      flex: 1;
      flex-direction: row;
    }

    /* LEFT PANEL */
    .left-panel {
      width: 40%;
      padding: 20px;
      background: #f0f0f0;
      border-right: 2px solid #ccc;
      display: flex;
      flex-direction: column;
    }

    #searchBox {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      font-size: 16px;
    }

    #searchResults {
      margin-top: 10px;
      padding: 10px;
      background: #fff;
      min-height: 100px;
      border: 1px solid #ccc;
      overflow-y: auto;
    }

    /* RIGHT PANEL */
    .right-panel {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    #dataOutput {
      width: 100%;
      height: 60vh;
      padding: 10px;
      font-family: monospace;
      font-size: 14px;
    }

    .buttons {
      margin-top: 10px;
    }
    .buttons button {
      padding: 10px 20px;
      margin-right: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    /* MOBILE LAYOUT */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
      .left-panel {
        width: 100%;
        border-right: none;
        border-bottom: 2px solid #ccc;
      }
      .right-panel {
        width: 100%;
      }
      #dataOutput {
        height: 40vh;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LEFT PANEL: SEARCH -->
  <div class="left-panel">
    <h2>Search JSON</h2>
    <input type="text" id="searchBox" placeholder="Search for key...">
    <div id="searchResults"></div>
  </div>

  <!-- RIGHT PANEL: JSON + BUTTONS -->
  <div class="right-panel">
    <h2>Data Output</h2>
    <textarea id="dataOutput"></textarea>

    <div class="buttons">
      <button id="refreshBtn">Refresh</button>
      <button id="updateBtn">Update</button>
    </div>
  </div>

</div>

<!-- Attach modular JS -->
<script src="dashboard.js"></script>

</body>
</html>
