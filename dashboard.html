<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>JSON Control Dashboard</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      background: #f4f4f4;
    }
    h1 {
      margin-bottom: 20px;
    }
    textarea {
      width: 100%;
      height: 400px;
      font-family: monospace;
      font-size: 14px;
      padding: 10px;
    }
    button {
      margin-top: 15px;
      margin-right: 10px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    #status {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>JSON Backend Dashboard</h1>

  <textarea id="dataBox" placeholder="Current JSON will appear here..."></textarea>

  <br>

  <button onclick="refreshData()">Refresh</button>
  <button onclick="updateData()">Update</button>

  <div id="status"></div>

  <script>
    const API_BASE = "http://127.0.0.1:5000";

    function setStatus(msg, isError=false) {
      const s = document.getElementById("status");
      s.style.color = isError ? "red" : "green";
      s.textContent = msg;
    }

    // Load the JSON from the backend
    async function refreshData() {
      try {
        const res = await fetch(`${API_BASE}/getall`);
        if (!res.ok) {
          setStatus("Error fetching data", true);
          return;
        }
        const json = await res.json();
        document.getElementById("dataBox").value = JSON.stringify(json, null, 2);
        setStatus("Data loaded.");
      } catch (err) {
        setStatus("Failed to connect to backend", true);
      }
    }

    // Send the JSON in the textbox back to the backend
    async function updateData() {
      const text = document.getElementById("dataBox").value;

      let parsed;
      try {
        parsed = JSON.parse(text);
      } catch (err) {
        setStatus("Textbox does not contain valid JSON!", true);
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/setall`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(parsed)
        });

        const data = await res.json();

        if (!res.ok) {
          setStatus("Backend error: " + data.error, true);
          return;
        }

        setStatus("Data successfully updated.");
      } catch (err) {
        setStatus("Failed to connect to backend", true);
      }
    }
  </script>

</body>
</html>
