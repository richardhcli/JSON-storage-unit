<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Incremental System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
    }

    /* ===== TOP TITLE BANNER ===== */
    /* Banner is in normal flow by default; it becomes fixed when the user scrolls */
    .banner {
      position: relative;
      width: 100%;
      height: 5vh;
      background: #333;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }

    .banner.sticky {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
    }

    .banner-title {
      font-size: 22px;
      font-weight: bold;
    }

    .banner input {
      padding: 6px 10px;
      font-size: 14px;
      border-radius: 4px;
      border: none;
    }

    /* ===== MAIN LAYOUT ===== */
    .container {
      display: flex;
      flex-direction: row;
      height: 95vh;
      margin-top: 0; /* will be adjusted via JS when banner becomes fixed */
    }

    /* LEFT PANEL */
    .left-panel {
      width: 60%;
      padding: 20px;
      background: #f0f0f0;
      border-right: 2px solid #ccc;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    #searchBox {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      font-size: 16px;
    }

    #searchResults {
      margin-top: 10px;
      padding: 10px;
      background: #fff;
      min-height: 100px;
      border: 1px solid #ccc;
      overflow-y: auto;
    }

    /* RIGHT PANEL */
    .right-panel {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    #dataOutput {
      width: 100%;
      height: 50vh;
      padding: 10px;
      font-family: monospace;
      font-size: 14px;
      border: 1px solid #ccc;
      background: #fff;
    }

    .buttons {
      margin-top: 10px;
    }
    .buttons button {
      padding: 10px 20px;
      margin-right: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    /* Log panel */
    #logBox {
      margin-top: 20px;
      padding: 10px;
      height: 15vh;
      background: #ffffff;
      border: 1px solid #ccc;
      font-family: monospace;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    /* MOBILE LAYOUT */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
      .left-panel {
        width: 100%;
        border-right: none;
        border-bottom: 2px solid #ccc;
      }
      .right-panel {
        width: 100%;
      }
      #dataOutput {
        height: 40vh;
      }
    }
  </style>
</head>

<body>

<!-- ===== TOP FIXED BANNER ===== -->
<div class="banner">
  <div class="banner-title">My Incremental System</div>

  <div class="banner-userid">
    <input type="text" id="userIdInput" placeholder="User ID">
  </div>
</div>

<!-- ===== MAIN CONTENT AREA ===== -->
<div class="container">

  <!-- LEFT PANEL -->
  <div class="left-panel">
    <h2>Search JSON</h2>
    <input type="text" id="searchBox" placeholder="Search for key...">
    <div id="searchResults"></div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right-panel">
    <h2>Data Output</h2>
    <textarea id="dataOutput"></textarea>

    <div class="buttons">
      <button id="refreshBtn">Refresh</button>
      <button id="updateBtn">Update</button>
    </div>

    <!-- Log Box -->
    <div id="logBox"></div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>

</body>
</html>
